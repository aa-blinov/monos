name: Live GitHub sync

# Two real Monos backends syncing through a real GitHub repository: the token, its permissions, connecting a first
# and a second device, a note travelling between them, a conflict and its settlement. The test uses a branch made
# for the run and removes it at the end, in a private repository kept only for this.
#
# It runs when MONOS_LIVE_GITHUB_REPO is set as a repository variable (Settings -> Secrets and variables ->
# Actions -> Variables), with the token in the secret MONOS_LIVE_GITHUB_TOKEN beside it. See docs/ARCHITECTURE.md.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - master
    paths:
      - 'webui/backend/routes/git.js'
      - 'webui/backend/indexing.js'
      - 'webui/backend/fts.js'
      - 'webui/backend/watcher.js'
      - 'webui/backend/support/**'
      - 'webui/backend/github-live.test.js'
      - '.github/workflows/live-github.yml'

permissions:
  contents: read

concurrency:
  group: live-github
  cancel-in-progress: false

jobs:
  live:
    if: ${{ vars.MONOS_LIVE_GITHUB_REPO != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MONOS_LIVE_GITHUB_TOKEN: ${{ secrets.MONOS_LIVE_GITHUB_TOKEN }}
      MONOS_LIVE_GITHUB_REPO: ${{ vars.MONOS_LIVE_GITHUB_REPO }}
    steps:
      - name: The token must be there
        run: |
          if [ -z "$MONOS_LIVE_GITHUB_TOKEN" ]; then
            echo "::error::The secret MONOS_LIVE_GITHUB_TOKEN is not set (Settings -> Secrets and variables -> Actions -> Secrets)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: webui/backend
      - name: Live sync against GitHub
        run: node --test webui/backend/github-live.test.js
